# Netlify deployment config.
# Netlify reads this automatically — you should not need to change build
# settings in the dashboard.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Vite fingerprints asset filenames (e.g. main-DebHwOKw.js), so those files can
# be cached forever — a new build produces a new name.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The HTML entry points must never be cached, or visitors keep seeing the old
# site after you redeploy.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/resume.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Sensible baseline security headers for a static site.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Let visitors reach the resume at /resume as well as /resume.html.
[[redirects]]
  from = "/resume"
  to = "/resume.html"
  status = 200
